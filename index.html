<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>PON Mock</title>
<style>
  [hidden] { display:none !important; }
  :root { --bg:#eef1f4; --ink:#1d2228; --panel:#ffffff; --line:#cfd6de; --accent:#1565c0; --soft:#e2e7ec; --muted:#4a5560; --onacc:#ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151a20; --ink:#e8edf2; --panel:#222a33; --line:#38424d; --accent:#64a8f0; --soft:#2b343e; --muted:#a9b4bf; --onacc:#0b1a2a; color-scheme:dark; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  header { padding:8px 12px 2px; }
  header h1 { margin:0; font-size:16px; }
  header p { margin:2px 0 0; font-size:12px; color:var(--muted); }
  .bar { display:flex; gap:6px; padding:5px 12px; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:thin; }
  .bar button { flex:0 0 auto; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 10px; font-size:13px; font-weight:600; color:var(--ink); }
  .bar button.on { outline:3px solid var(--accent); border-color:var(--accent); }
  .sw { display:inline-block; width:14px; height:4px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  .sq { display:inline-block; width:10px; height:10px; vertical-align:middle; margin-right:5px; border:1px solid #000; }
  #wrap { flex:1; min-height:0; padding:0 8px; }
  svg#map { width:100%; height:100%; background:#fff; border:1px solid var(--line); border-radius:12px; touch-action:none; display:block; }
  #hint { font-size:12px; color:var(--muted); padding:3px 12px; min-height:18px; }
  footer { display:flex; gap:6px; padding:6px 12px 10px; flex-wrap:wrap; }
  footer button { flex:1 1 30%; border:0; border-radius:10px; padding:11px 8px; font-size:14px; font-weight:700; background:var(--soft); color:var(--ink); }
  footer button.go { background:var(--accent); color:var(--onacc); }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
  #toast.show { opacity:1; }
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .ov .card { background:var(--panel); color:var(--ink); border-radius:14px; padding:14px; width:100%; max-width:640px; max-height:92%; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .ov p { margin:0; font-size:13px; }
  .ov img { width:100%; border:1px solid var(--line); border-radius:8px; }
  .ov input, .ov textarea { width:100%; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  .ov .row { display:flex; gap:8px; }
  .ov .row button { flex:1; border:0; border-radius:10px; padding:11px; font-weight:700; font-size:14px; background:var(--soft); color:var(--ink); }
  .ov .row button.go { background:var(--accent); color:var(--onacc); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <h1>PON Mock: one full PON (112 homes)</h1>
  <p>Draw the network your way: 1:16, 1:8s, poles, link, distribution and drops. Then tap <b>Save picture</b> and send it in Relay.</p>
</header>
<div class="bar" id="tools">
  <button data-t="drop" class="on"><span class="sw" style="background:#2e7d32"></span>Drop</button>
  <button data-t="cross"><span class="sw" style="background:#8e24aa"></span>Road-crossing drop</button>
  <button data-t="dist"><span class="sw" style="background:#d32f2f"></span>Distribution</button>
  <button data-t="link"><span class="sw" style="background:#ef6c00"></span>Link cable</button>
  <button data-t="feed"><span class="sw" style="background:#0d47a1"></span>Feeder</button>
  <button data-t="s16"><span class="sq" style="background:#c62828;border-radius:50%"></span>+ 1:16</button>
  <button data-t="s8"><span class="sq" style="background:#ffb300"></span>+ 1:8</button>
  <button data-t="pole"><span class="sq" style="background:#fff;border-radius:50%"></span>+ Pole</button>
  <button data-t="note">+ Note</button>
  <button data-t="del">Delete</button>
  <button data-t="pan">Move map</button>
</div>
<div class="bar">
  <button data-s="straight" class="on">Straight</button>
  <button data-s="bend">Bends (tap points)</button>
  <button data-s="free">Freehand</button>
  <button id="zin">Zoom +</button>
  <button id="zout">Zoom &minus;</button>
  <button id="zfit">Fit</button>
</div>
<div id="hint"></div>
<div id="wrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
<footer>
  <button id="undo">Undo</button>
  <button id="finish">Finish line</button>
  <button id="clear">Clear all</button>
  <button id="copy">Copy coordinates</button>
  <button id="save" class="go">Save picture</button>
</footer>
<div id="toast"></div>
<div id="noteBox" class="ov" hidden><div class="card"><label for="noteIn">Note text</label><input id="noteIn" type="text" autocomplete="off"><div class="row"><button id="noteCancel">Cancel</button><button id="noteOk" class="go">Add note</button></div></div></div>
<div id="picBox" class="ov" hidden><div class="card"><p>Long-press the picture and Save / Share it, or take a screenshot. Then attach it in Relay.</p><img id="pic" alt="Your drawing"><div class="row"><button id="picClose" class="go">Done</button></div></div></div>
<div id="txtBox" class="ov" hidden><div class="card"><p>Copy this text and paste it in Relay.</p><textarea id="txtOut" rows="10" readonly></textarea><div class="row"><button id="txtClose" class="go">Done</button></div></div></div>
<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
// metres, SVG y down. PON = 8 street blocks (2 x 4), each 2 rows of 7 erven (15 x 30 m) = 112 homes.
const FULL = { x:-92, y:-78, w:352, h:452 };
let vb = Object.assign({}, FULL);
let tool = "drop", style = "straight";
const items = []; let active = null;
const COL = { drop:"#2e7d32", cross:"#8e24aa", dist:"#d32f2f", link:"#ef6c00", feed:"#0d47a1" };
const WID = { drop:0.9, cross:0.9, dist:1.4, link:1.6, feed:2.2 };
const NAME = { drop:"Drop", cross:"ROAD-CROSSING DROP", dist:"Distribution cable", link:"Link cable", feed:"Feeder" };

function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent||svg).appendChild(e); return e; }
function txt(s, x, y, size, fill, weight, parent, anchor){ const t = el("text", {x, y, "font-size":size, fill, "font-weight":weight||"normal", "font-family":"system-ui,sans-serif", "text-anchor":anchor||"start"}, parent); t.textContent = s; return t; }
function setVB(){ svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fitVB(){ const r = svg.getBoundingClientRect(); const a = r.width / Math.max(r.height,1);
  vb = Object.assign({}, FULL); if (vb.w / vb.h < a) { const w = vb.h * a; vb.x -= (w - vb.w)/2; vb.w = w; } else { const h = vb.w / a; vb.y -= (h - vb.h)/2; vb.h = h; } setVB(); }

const base = el("g", {id:"base"}); const ink = el("g", {id:"ink"});
const GREY = "#d9d9d9";
const colX = [[0,105],[121,226]];
const rowY = [[0,60],[76,136],[152,212],[228,288]];
// road reserves (16 m): around and between the blocks, plus the main road on the west carrying the feeder
const roadsH = [-16, 60, 136, 212, 288];           // top edge of each east-west reserve
const roadsV = [-16, 105, 226];                     // west edge of each north-south reserve
roadsH.forEach(y => el("rect", {x:-92, y, width:350, height:16, fill:GREY}, base));
roadsV.forEach(x => el("rect", {x, y:-78, width:16, height:452, fill:GREY}, base));
roadsH.forEach(y => el("line", {x1:-92, y1:y+8, x2:258, y2:y+8, stroke:"#9e9e9e", "stroke-width":0.4, "stroke-dasharray":"3 2"}, base));
roadsV.forEach(x => el("line", {x1:x+8, y1:-78, x2:x+8, y2:374, stroke:"#9e9e9e", "stroke-width":0.4, "stroke-dasharray":"3 2"}, base));
const mr = txt("MAIN ROAD", 0, 0, 4.2, "#555", "bold", base); mr.setAttribute("transform", "translate(-1,-30) rotate(-90)");
const homes = [];
function block(x0, x1, y0, y1, pre, faded){
  const w = 15; let n = 1;
  [[y0, y0 + 30, "top"], [y0 + 30, y1, "bot"]].forEach(([a, b, side]) => {
    for (let x = x0; x + w <= x1 + 0.1; x += w, n++){
      el("rect", {x, y:a, width:w, height:b-a, fill: faded ? "#f1f1f1" : "#fff8e7", stroke: faded ? "#c9c9c9" : "#b07a2a", "stroke-width":0.35}, base);
      const hy = side === "top" ? a + 10 : b - 10;
      el("circle", {cx:x+w/2, cy:hy, r:1.6, fill: faded ? "#b0bec5" : "#1565c0", stroke:"#fff", "stroke-width":0.4}, base);
      if (!faded){ txt(pre+n, x+w/2, side === "top" ? a + 21 : a + 11, 3.0, "#7a4a10", "normal", base, "middle"); homes.push({label:pre+n, x:x+w/2, y:hy}); }
    }
  });
}
const L = "ABCDEFGH"; let bi = 0;
rowY.forEach(([y0,y1]) => colX.forEach(([x0,x1]) => block(x0, x1, y0, y1, L[bi++], false)));
// next PONs (faded) west of the main road and east
rowY.forEach(([y0,y1]) => { block(-76, -16, y0, y1, "", true); block(242, 257, y0, y1, "", true); });
// PON boundary on road centres
el("rect", {x:-8, y:-8, width:242, height:304, fill:"none", stroke:"#6a1b9a", "stroke-width":1.2, "stroke-dasharray":"6 3"}, base);
const pl = txt("PON 01 · 112 homes · 8 blocks", 113, -10.5, 4.6, "#6a1b9a", "bold", base, "middle");
txt("next PON", -46, -22, 4, "#90a4ae", "bold", base, "middle");
txt("next PON", 250, -22, 4, "#90a4ae", "bold", base, "middle");
// feeder: from the POP, past the PON along the main road, on to the next PONs
el("line", {x1:-12, y1:-78, x2:-12, y2:374, stroke:COL.feed, "stroke-width":2.2}, base);
const f1 = txt("FEEDER from POP", 0, 0, 3.8, COL.feed, "bold", base); f1.setAttribute("transform", "translate(-14.5,-20) rotate(-90)");
const f2 = txt("FEEDER on to next PONs", 0, 0, 3.8, COL.feed, "bold", base); f2.setAttribute("transform", "translate(-14.5,372) rotate(-90)");
el("line", {x1:150, y1:362, x2:200, y2:362, stroke:"#000", "stroke-width":1.2}, base);
txt("50 m", 175, 359, 3.4, "#000", "normal", base, "middle");
svg.appendChild(ink);

// ---------- drawing ----------
function pt(ev){ const r = svg.getBoundingClientRect(); return { x: vb.x + (ev.clientX - r.left) / r.width * vb.w, y: vb.y + (ev.clientY - r.top) / r.height * vb.h }; }
function snapPts(){
  const s = homes.map(h => ({x:h.x, y:h.y}));
  items.forEach(it => { if (it.kind === "line") it.pts.forEach(p => s.push(p)); else if (it.kind !== "note") s.push({x:it.x, y:it.y}); });
  return s;
}
function snapToFeeder(p){ return Math.abs(p.x + 12) < 3 && p.y > -78 && p.y < 374 ? {x:-12, y:p.y} : null; }
function snap(p){
  let best = null, bd = 3;
  snapPts().forEach(h => { const d = Math.hypot(h.x - p.x, h.y - p.y); if (d < bd) { bd = d; best = {x:h.x, y:h.y}; } });
  return best || snapToFeeder(p) || p;
}
function render(){
  ink.innerHTML = "";
  const all = active ? items.concat([active]) : items;
  all.filter(i => i.kind === "line").forEach(it => {
    el("polyline", {points: it.pts.map(p => p.x+","+p.y).join(" "), fill:"none", stroke:COL[it.type], "stroke-width":WID[it.type], "stroke-linecap":"round", "stroke-linejoin":"round"}, ink);
    if (it === active && style === "bend") it.pts.forEach(p => el("circle", {cx:p.x, cy:p.y, r:1, fill:COL[it.type]}, ink));
  });
  let n16 = 0, n8 = 0, np = 0;
  all.filter(i => i.kind !== "line").forEach(it => {
    if (it.kind === "pole"){ np++; el("circle", {cx:it.x, cy:it.y, r:2.1, fill:"#fff", stroke:"#000", "stroke-width":0.6}, ink); }
    else if (it.kind === "s8"){ n8++; el("rect", {x:it.x-2.6, y:it.y-2.6, width:5.2, height:5.2, fill:"#ffb300", stroke:"#000", "stroke-width":0.6}, ink);
      txt("1:8 #" + n8, it.x + 3.4, it.y - 2.6, 3, "#8a5300", "bold", ink); }
    else if (it.kind === "s16"){ n16++; el("circle", {cx:it.x, cy:it.y, r:3.4, fill:"#c62828", stroke:"#000", "stroke-width":0.6}, ink);
      txt("1:16", it.x + 4.2, it.y - 3, 3.4, "#c62828", "bold", ink); }
    else if (it.kind === "note"){ const t = txt(it.text, it.x, it.y, 3.6, "#c62828", "bold", ink);
      t.setAttribute("paint-order", "stroke"); t.setAttribute("stroke", "#fff"); t.setAttribute("stroke-width", "1"); }
  });
  const nd = items.filter(i => i.kind === "line" && (i.type === "drop" || i.type === "cross")).length;
  pl.textContent = `PON 01 · 112 homes · ${nd} drops · ${n8} × 1:8 · ${n16} × 1:16`;
  hint();
}
function hint(){
  const h = document.getElementById("hint");
  const m = { pan:"Drag to move the map. Zoom + / − to zoom.", s16:"Tap where the 1:16 goes.", s8:"Tap where each 1:8 goes.", pole:"Tap where each pole goes.",
    note:"Tap where the note goes, then type it.", del:"Tap anything you drew to delete it." };
  if (m[tool]) { h.textContent = m[tool]; return; }
  if (style === "straight") h.textContent = "Drag to draw a straight line. Ends snap to homes, poles, splitters and the feeder.";
  else if (style === "bend") h.textContent = active ? "Keep tapping points, then press Finish line." : "Tap each corner point, then press Finish line.";
  else h.textContent = "Draw with your finger.";
}
function segDist(p, a, b){ const dx = b.x - a.x, dy = b.y - a.y, l = dx*dx + dy*dy; let t = l ? ((p.x-a.x)*dx + (p.y-a.y)*dy) / l : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p.x - a.x - t*dx, p.y - a.y - t*dy); }
function deleteAt(p){
  let bi = -1, bd = 4;
  items.forEach((it, i) => { let d;
    if (it.kind === "line"){ d = 1e9; for (let k = 1; k < it.pts.length; k++) d = Math.min(d, segDist(p, it.pts[k-1], it.pts[k])); }
    else d = Math.hypot(it.x - p.x, it.y - p.y);
    if (d < bd) { bd = d; bi = i; } });
  if (bi >= 0) { items.splice(bi, 1); render(); toast("Deleted"); } else toast("Nothing drawn there");
}
let panFrom = null, pendingNote = null;
svg.addEventListener("pointerdown", ev => {
  ev.preventDefault(); svg.setPointerCapture(ev.pointerId);
  const p = pt(ev);
  if (tool === "pan"){ panFrom = {cx:ev.clientX, cy:ev.clientY, x:vb.x, y:vb.y}; return; }
  if (tool === "del"){ deleteAt(p); return; }
  if (tool === "pole" || tool === "s8" || tool === "s16"){ const q = tool === "pole" ? p : snap(p); items.push({kind:tool, x:q.x, y:q.y}); render(); return; }
  if (tool === "note"){ pendingNote = p; document.getElementById("noteBox").hidden = false; const ni = document.getElementById("noteIn"); ni.value = ""; ni.focus(); return; }
  const q = snap(p);
  if (style === "bend"){ if (!active || active.type !== tool) active = {kind:"line", type:tool, pts:[]}; active.pts.push(q); render(); return; }
  active = {kind:"line", type:tool, pts:[q, q]}; render();
});
svg.addEventListener("pointermove", ev => {
  if (tool === "pan" && panFrom){ const r = svg.getBoundingClientRect();
    vb.x = panFrom.x - (ev.clientX - panFrom.cx) / r.width * vb.w; vb.y = panFrom.y - (ev.clientY - panFrom.cy) / r.height * vb.h; setVB(); return; }
  if (!active || style === "bend" || !(ev.buttons || ev.pressure)) return;
  const p = pt(ev);
  if (style === "straight") active.pts[1] = snap(p);
  else { const l = active.pts[active.pts.length-1]; if (Math.hypot(l.x-p.x, l.y-p.y) > 0.8) active.pts.push(p); }
  render();
});
svg.addEventListener("pointerup", () => {
  panFrom = null;
  if (!active || style === "bend") return;
  if (style === "free") active.pts[active.pts.length-1] = snap(active.pts[active.pts.length-1]);
  const q = active.pts; if (Math.hypot(q[0].x - q[q.length-1].x, q[0].y - q[q.length-1].y) > 1.5) items.push(active);
  active = null; render();
});
function finishBend(){ if (active && active.pts.length > 1) items.push(active); active = null; render(); }

document.getElementById("noteOk").onclick = () => { const v = document.getElementById("noteIn").value.trim();
  if (v && pendingNote) { items.push({kind:"note", x:pendingNote.x, y:pendingNote.y, text:v}); render(); }
  pendingNote = null; document.getElementById("noteBox").hidden = true; };
document.getElementById("noteCancel").onclick = () => { pendingNote = null; document.getElementById("noteBox").hidden = true; };
document.getElementById("picClose").onclick = () => { document.getElementById("picBox").hidden = true; };
document.getElementById("txtClose").onclick = () => { document.getElementById("txtBox").hidden = true; };
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { finishBend(); tool = b.dataset.t;
  document.querySelectorAll("[data-t]").forEach(x => x.classList.toggle("on", x === b)); hint(); });
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { finishBend(); style = b.dataset.s;
  document.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x === b)); hint(); });
function zoom(f){ const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2; vb.w *= f; vb.h *= f; vb.x = cx - vb.w/2; vb.y = cy - vb.h/2; setVB(); }
document.getElementById("zin").onclick = () => zoom(0.7);
document.getElementById("zout").onclick = () => zoom(1/0.7);
document.getElementById("zfit").onclick = fitVB;
document.getElementById("undo").onclick = () => { if (active) { active.pts.pop(); if (active.pts.length < 1) active = null; } else items.pop(); render(); };
document.getElementById("finish").onclick = finishBend;
let clearArmed = 0;
document.getElementById("clear").onclick = () => { if (!items.length) return; const now = Date.now();
  if (now - clearArmed < 2500) { items.length = 0; active = null; render(); toast("Cleared"); } else { clearArmed = now; toast("Tap Clear all again to wipe"); } };
function toast(s){ const t = document.getElementById("toast"); t.textContent = s; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2000); }

function nearest(p){
  let b = null, bd = 4;
  homes.forEach(h => { const d = Math.hypot(h.x - p.x, h.y - p.y); if (d < bd) { bd = d; b = "home " + h.label; } });
  items.forEach(it => { if (it.kind === "s8" || it.kind === "s16" || it.kind === "pole") { const d = Math.hypot(it.x - p.x, it.y - p.y); if (d < bd) { bd = d; b = it.kind === "s8" ? "1:8" : it.kind === "s16" ? "1:16" : "pole"; } } });
  if (!b && Math.abs(p.x + 12) < 1) b = "feeder";
  return b || `(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`;
}
function summary(){
  return items.map((it, i) => {
    if (it.kind === "line"){ const len = it.pts.reduce((s, p, k) => k ? s + Math.hypot(p.x - it.pts[k-1].x, p.y - it.pts[k-1].y) : 0, 0);
      return `${i+1}. ${NAME[it.type]} ${nearest(it.pts[0])} -> ${nearest(it.pts[it.pts.length-1])}, ${len.toFixed(1)} m, pts ` + it.pts.map(p => `(${p.x.toFixed(1)},${p.y.toFixed(1)})`).join(" "); }
    if (it.kind === "note") return `${i+1}. Note at (${it.x.toFixed(1)},${it.y.toFixed(1)}): ${it.text}`;
    return `${i+1}. ${it.kind === "pole" ? "Pole" : it.kind === "s8" ? "1:8" : "1:16"} at (${it.x.toFixed(1)},${it.y.toFixed(1)})`;
  }).join("\n");
}
document.getElementById("copy").onclick = async () => {
  finishBend();
  const s = "PON mock (metres, x east, y SOUTH, top-left erf corner = 0,0)\n" + (summary() || "(nothing drawn)");
  try { await navigator.clipboard.writeText(s); toast("Copied - paste it in Relay"); }
  catch (e) { const t = document.getElementById("txtOut"); t.value = s; document.getElementById("txtBox").hidden = false; t.focus(); t.select(); }
};
document.getElementById("save").onclick = () => {
  finishBend();
  const clone = svg.cloneNode(true); const extra = 26;
  clone.setAttribute("viewBox", `${FULL.x} ${FULL.y} ${FULL.w} ${FULL.h + extra}`);
  const W = 1600, H = Math.round(W * (FULL.h + extra) / FULL.w);
  clone.setAttribute("width", W); clone.setAttribute("height", H);
  const bg = document.createElementNS(NS, "rect"); bg.setAttribute("x", FULL.x); bg.setAttribute("y", FULL.y); bg.setAttribute("width", FULL.w); bg.setAttribute("height", FULL.h + extra); bg.setAttribute("fill", "#fff");
  clone.insertBefore(bg, clone.firstChild);
  const lg = document.createElementNS(NS, "g"); clone.appendChild(lg);
  Object.keys(COL).forEach((k, i) => {
    const x = FULL.x + 6 + (i % 3) * 115, y = FULL.y + FULL.h + 7 + Math.floor(i / 3) * 9;
    const l = document.createElementNS(NS, "line"); l.setAttribute("x1", x); l.setAttribute("x2", x + 12); l.setAttribute("y1", y); l.setAttribute("y2", y); l.setAttribute("stroke", COL[k]); l.setAttribute("stroke-width", 2); lg.appendChild(l);
    const t = document.createElementNS(NS, "text"); t.setAttribute("x", x + 15); t.setAttribute("y", y + 1.5); t.setAttribute("font-size", 4.5); t.setAttribute("font-family", "sans-serif"); t.textContent = NAME[k].charAt(0) + NAME[k].slice(1).toLowerCase(); lg.appendChild(t);
  });
  const img = new Image();
  img.onload = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
    document.getElementById("pic").src = c.toDataURL("image/png"); document.getElementById("picBox").hidden = false; };
  img.onerror = () => toast("Could not make the picture - use Copy coordinates");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(clone));
};
window.addEventListener("resize", fitVB);
fitVB(); render();
})();
</script>
